<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - GIODAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎬%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="splash-screen" id="splashScreen">
    <div class="splash-logo">GIODAI</div>
    <div class="splash-loader"></div>
  </div>

  <div class="auth-page" id="authPage" style="opacity:0">
    <div class="auth-brand">
      <div class="auth-brand-content">
        <div class="auth-brand-logo">GIODAI</div>
        <div class="auth-brand-tagline">Turn Images Into Cinematic Videos.</div>
      </div>
    </div>

    <div class="auth-form-side">
      <div class="auth-form-container">
        <div class="auth-form-header">
          <h1>Reset Password</h1>
          <p>Enter your email and we'll send you a reset link</p>
        </div>

        <div class="auth-card">
          <form id="forgotForm">
            <div id="forgotFormFields">
              <div class="form-floating">
                <input type="email" class="form-input" id="forgotEmail" placeholder=" " required autocomplete="email">
                <label class="form-label">Email Address</label>
              </div>
              <button type="submit" class="btn btn-primary btn-lg w-full" id="forgotBtn" style="margin-top:var(--space-4)">
                Send Reset Link
              </button>
            </div>

            <div id="forgotSuccess" class="forgot-success" style="display:none">
              <div class="forgot-success-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              </div>
              <h3>Check Your Email</h3>
              <p style="color:var(--text-tertiary);margin-top:var(--space-2)">We've sent a password reset link to your email address. Please check your inbox.</p>
              <a href="login.html" class="btn btn-primary" style="margin-top:var(--space-6)">Back to Sign In</a>
            </div>
          </form>

          <div class="auth-footer">
            Remember your password? <a href="login.html">Sign in</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/firebase-init.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('splashScreen').classList.add('hidden');
        document.getElementById('authPage').style.opacity = '1';
        document.getElementById('authPage').style.transition = 'opacity 0.4s ease';
      }, 1000);
    });
  </script>
</body>
</html>
