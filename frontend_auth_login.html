<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - GIODAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎬%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="splash-screen" id="splashScreen">
    <div class="splash-logo">GIODAI</div>
    <div class="splash-loader"></div>
  </div>

  <div class="auth-page" id="authPage" style="opacity:0">
    <!-- Brand Side -->
    <div class="auth-brand">
      <div class="auth-brand-content">
        <div class="auth-brand-logo">GIODAI</div>
        <div class="auth-brand-tagline">Turn Images Into Cinematic Videos.</div>
        <div class="auth-brand-features">
          <div class="auth-brand-feature">
            <div class="auth-brand-feature-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            </div>
            AI-Powered Video Creation
          </div>
          <div class="auth-brand-feature">
            <div class="auth-brand-feature-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </div>
            Professional Ken Burns Effects
          </div>
          <div class="auth-brand-feature">
            <div class="auth-brand-feature-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
            </div>
            Export in 720p, 1080p, 4K
          </div>
          <div class="auth-brand-feature">
            <div class="auth-brand-feature-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
            </div>
            Ready-Made Templates
          </div>
        </div>
      </div>
    </div>

    <!-- Form Side -->
    <div class="auth-form-side">
      <div class="auth-form-container">
        <div class="auth-form-header">
          <h1>Welcome Back</h1>
          <p>Sign in to continue creating amazing videos</p>
        </div>

        <div class="auth-card">
          <!-- Google Sign-In -->
          <div class="auth-social">
            <button class="btn-google" id="googleSignInBtn">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
              </svg>
              Continue with Google
            </button>
          </div>

          <div class="divider-text">or sign in with email</div>

          <!-- Email Login Form -->
          <form id="loginForm">
            <div class="form-floating">
              <input type="email" class="form-input" id="loginEmail" placeholder=" " required autocomplete="email">
              <label class="form-label">Email Address</label>
            </div>

            <div class="form-floating">
              <div class="form-password-wrapper">
                <input type="password" class="form-input" id="loginPassword" placeholder=" " required autocomplete="current-password">
                <label class="form-label">Password</label>
                <div class="form-password-toggle" id="togglePassword">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </div>
              </div>
            </div>

            <div class="auth-links">
              <label class="auth-remember">
                <input type="checkbox" id="rememberMe" class="checkbox">
                <span class="checkbox-mark"></span>
                <span style="margin-left:4px">Remember me</span>
              </label>
              <a href="forgot-password.html" class="auth-forgot">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-full" id="loginBtn">
              Sign In
            </button>
          </form>

          <div class="auth-footer">
            Don't have an account? <a href="register.html">Create one</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/firebase-init.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('splashScreen').classList.add('hidden');
        document.getElementById('authPage').style.opacity = '1';
        document.getElementById('authPage').style.transition = 'opacity 0.4s ease';
      }, 1000);
    });
  </script>
</body>
</html>
